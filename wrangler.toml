name = "sportmanager"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./"

[[d1_databases]]
binding = "D1"
database_name = "sportmanager_db"
# Cloudflare requires database_id (not just database_name) to actually bind
# D1 for Pages deploys - fill this in with the id printed by:
#   npx wrangler d1 create sportmanager_db
database_id = "REPLACE_WITH_DATABASE_ID_FROM_WRANGLER_D1_CREATE"
